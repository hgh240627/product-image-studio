name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate version tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version"
          }

      - name: Run checks
        run: npm run check

      - name: Build Windows release
        run: npm run dist -- --publish never

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $exe = "dist/product-image-studio-$version-Windows-x64.exe"
          $zip = "dist/product-image-studio-$version-Windows-x64.zip"
          if (-not (Test-Path $exe)) { throw "Missing installer: $exe" }
          if (-not (Test-Path $zip)) { throw "Missing zip: $zip" }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $zip --clobber
          } else {
            gh release create $tag $exe $zip --title $tag --notes "Automated release for $tag."
          }

      - name: Generate update manifest
        run: npm run release-manifest -- --summary "此版本包含最新修复和优化。" --note "请查看 GitHub Release 页面了解更新内容。"

      - name: Commit update manifest to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No update.json changes to commit."
            exit 0
          }
          git commit -m "Update release manifest for ${{ github.ref_name }}"
          git push origin HEAD:main
